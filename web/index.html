<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ne giysem?</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>ne giysem?</h1>
        <div class="lang-switch" role="group" aria-label="Language">
            <button data-lang="en" class="active">EN</button>
            <button data-lang="tr">TR</button>
        </div>
    </header>

    <main>
        <section class="card" id="ask-section">
            <h2 data-i18n="ask_title">Tell me your plan</h2>
            <textarea id="ask-input" rows="2" maxlength="300"></textarea>
            <button id="ask-btn" data-i18n="ask">Suggest an outfit</button>
            <div class="hidden" id="ask-result">
                <div id="ask-weather-line" class="note"></div>
                <ul id="ask-outfit-list" class="outfit"></ul>
                <p id="ask-explanation"></p>
                <div class="feedback" id="ask-feedback-box"></div>
            </div>
        </section>

        <section class="card" id="mood-section">
            <h2 data-i18n="mood_title">How do you feel today?</h2>
            <textarea id="feel-input" rows="2" maxlength="300"></textarea>
            <p class="note" data-i18n="mood_quick">...or pick one quickly:</p>
            <div id="mood-chips" class="chips"></div>
            <label class="toggle hidden" id="wardrobe-toggle">
                <input type="checkbox" id="use-wardrobe" checked>
                <span data-i18n="use_wardrobe">Recommend from my wardrobe</span>
            </label>
        </section>

        <section class="card" id="weather-section">
            <h2 data-i18n="weather_title">Weather &amp; location</h2>
            <div class="weather-row">
                <span><span data-i18n="location_label">Location</span>: <strong id="location-name">…</strong></span>
                <button id="location-edit-btn" class="link-btn" data-i18n="change">change</button>
            </div>
            <div id="location-editor" class="hidden">
                <input type="text" id="city-input" maxlength="60" autocomplete="off">
                <div id="city-results" class="chips"></div>
                <button id="location-auto-btn" class="link-btn" data-i18n="auto_locate">Use my IP location</button>
            </div>
            <label class="hours-row">
                <span data-i18n="hours_label">When will you be out?</span>
                <span class="hours-selects">
                    <select id="hour-start"></select>
                    <span>–</span>
                    <select id="hour-end"></select>
                </span>
            </label>
            <label class="hours-row">
                <span data-i18n="gender_label">Catalog suggestions for</span>
                <select id="gender-select">
                    <option value="" data-i18n="gender_any">everyone</option>
                    <option value="male" data-i18n="gender_male">men</option>
                    <option value="female" data-i18n="gender_female">women</option>
                </select>
            </label>
            <label class="toggle">
                <input type="checkbox" id="manual-weather">
                <span data-i18n="manual_weather">I'll enter the weather myself</span>
            </label>
            <div id="manual-weather-fields" class="hidden">
                <label>
                    <span data-i18n="temp_label">Temperature (°C)</span>
                    <input type="number" id="manual-temp" min="-30" max="50" step="0.5" value="20">
                </label>
                <label class="toggle">
                    <input type="checkbox" id="manual-rain">
                    <span data-i18n="rain_label">Rainy</span>
                </label>
            </div>
        </section>

        <button id="recommend-btn" data-i18n="recommend">What should I wear?</button>

        <section class="card hidden" id="result">
            <div id="weather-line" class="note"></div>
            <div id="mood-line" class="note hidden"></div>
            <p id="source-note" class="note hidden" data-i18n="catalog_fallback"></p>
            <ul id="outfit-list" class="outfit"></ul>
            <p id="explanation" class="reason hidden"></p>
            <div class="feedback" id="feedback-box"></div>
        </section>

        <section class="card" id="wardrobe-section">
            <h2 data-i18n="wardrobe_title">My wardrobe</h2>
            <p id="wardrobe-empty" class="note" data-i18n="wardrobe_empty"></p>
            <ul id="wardrobe-list"></ul>

            <details id="add-form">
                <summary data-i18n="add_item">Add clothing item</summary>
                <div class="form-grid">
                    <label>
                        <span data-i18n="photo_label">Photo (optional)</span>
                        <input type="file" id="photo-input" accept="image/jpeg,image/png,image/webp">
                    </label>
                    <p id="classify-note" class="note hidden"></p>
                    <label>
                        <span data-i18n="type_label">Type</span>
                        <select id="type-select"></select>
                    </label>
                    <div id="attribute-selects"></div>
                    <label>
                        <span data-i18n="label_label">Name (optional)</span>
                        <input type="text" id="label-input" maxlength="60">
                    </label>
                    <button id="save-btn" data-i18n="save">Save</button>
                </div>
            </details>
        </section>

        <p id="error" class="error hidden"></p>
    </main>

    <footer data-i18n="footer">Weather by open-meteo.com &middot; location by ip-api.com</footer>

    <script src="app.js"></script>
</body>
</html>
